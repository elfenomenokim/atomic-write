[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "atomic-write"
version = "0.1.0"
description = "Replace a file with complete bytes, or leave the previous bytes in place."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["atomic", "filesystem", "durability", "fsync", "crash-safety"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Topic :: System :: Filesystems",
]

[project.urls]
Homepage = "https://github.com/elfenomenokim/atomic-write"
Repository = "https://github.com/elfenomenokim/atomic-write"
Issues = "https://github.com/elfenomenokim/atomic-write/issues"

[tool.setuptools]
package-dir = { "" = "python" }
packages = ["atomic_write"]
